spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/unipar_trilha}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    br.unipar.trilha: INFO

app:
  security:
    jwt:
      secret: ${JWT_SECRET:CHANGE_ME_DEV_SECRET_USE_AT_LEAST_32_CHARS_FOR_HS256}
