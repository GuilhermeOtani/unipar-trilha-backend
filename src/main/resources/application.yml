spring:
  application:
    name: unipar-trilha-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: America/Sao_Paulo
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  security:
    jwt:
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
      issuer: unipar-trilha-api
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      exposed-headers: "Authorization,Content-Disposition"
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
      max-age: 3600
